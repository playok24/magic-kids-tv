<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Kids TV - Panel Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0b0b14;color:#eee;min-height:100vh}
#login-view{display:flex;justify-content:center;align-items:center;min-height:100vh}
#login-box{background:#13131f;border:1px solid #333;border-radius:16px;padding:28px 24px;width:85%;max-width:340px;text-align:center}
#login-box h3{color:#c4a0ff;font-size:18px;margin-bottom:14px}
#login-box input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #444;background:#1a1a2e;color:#fff;font-size:14px;text-align:center;outline:none;margin-bottom:12px}
#login-box input:focus{border-color:#7c3aed}
#login-box button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
#login-box button:active{opacity:0.8}
#login-status{font-size:12px;margin-top:10px;min-height:16px;color:#ff6b6b}
#login-status.ok{color:#00ff66}
#login-status.err{color:#ff6b6b}
#panel-view{display:none;max-width:960px;margin:0 auto;padding:20px}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px;flex-wrap:wrap}
#topbar h1{font-size:20px;color:#c4a0ff}
#topbar .actions{display:flex;gap:8px}
#topbar button{padding:8px 14px;border:none;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
#topbar button.logout{background:rgba(255,68,68,0.2);color:#ff6b6b}
#admin-email{font-size:12px;color:#888}
#user-list{display:flex;flex-direction:column;gap:10px}
.user-card{background:#13131f;border:1px solid #333;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.user-av{width:40px;height:40px;border-radius:50%;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:180px}
.user-info .name{font-weight:700;font-size:14px}
.user-info .email{font-size:12px;color:#888}
.user-info .meta{font-size:11px;color:#666;margin-top:2px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-left:6px}
.badge.admin{background:rgba(255,204,0,0.15);color:#ffcc00}
.badge.blocked{background:rgba(255,68,68,0.15);color:#ff6b6b}
.badge.active{background:rgba(0,255,102,0.12);color:#00ff66}
.user-actions{display:flex;gap:6px;flex-wrap:wrap}
.user-actions button{padding:8px 12px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.btn-block{background:rgba(255,68,68,0.2);color:#ff6b6b}
.btn-unblock{background:rgba(0,255,102,0.15);color:#00ff66}
.btn-admin-off{background:rgba(255,204,0,0.15);color:#ffcc00}
.btn-admin-on{background:rgba(255,204,0,0.3);color:#ffcc00}
.btn-code{background:rgba(0,204,255,0.15);color:#00ccff}
.btn-del{background:rgba(255,68,68,0.3);color:#ff6b6b}
#codes-section{background:#13131f;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:20px}
#codes-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
#codes-header h2{font-size:15px;color:#c4a0ff}
#codes-header button{padding:8px 14px;border:none;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
#new-code-box{background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:12px;display:none;align-items:center;gap:10px;margin-bottom:12px}
#new-code-info{font-size:12px;color:#00ccff;margin-bottom:12px;display:none}
#new-code-value{flex:1;font-size:20px;font-weight:700;color:#00ff66;letter-spacing:3px;font-family:monospace;word-break:break-all}
#copy-code-btn{padding:8px 12px;border:none;border-radius:8px;background:rgba(0,255,102,0.15);color:#00ff66;font-size:12px;font-weight:700;cursor:pointer}
#codes-list{display:flex;flex-direction:column;gap:8px}
.code-card{background:#0f0f1a;border:1px solid #333;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code-card .code{font-family:monospace;font-weight:700;font-size:16px;letter-spacing:2px;flex:1;min-width:120px}
.code-card .meta{font-size:11px;color:#666;flex:1;min-width:140px}
.code-card button{padding:6px 10px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.code-revoke{background:rgba(255,204,0,0.15);color:#ffcc00}
.code-del{background:rgba(255,68,68,0.2);color:#ff6b6b}
.user-code-box{flex-basis:100%;display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:10px;border-top:1px solid #222}
.user-code-empty{font-size:11px;color:#666}
.user-code-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#0f0f1a;border:1px solid #333;border-radius:8px;padding:8px 10px}
.user-code-line.just-generated{border-color:#00ff66;box-shadow:0 0 8px rgba(0,255,102,0.25)}
.user-code-value{font-family:monospace;font-weight:700;font-size:15px;letter-spacing:2px;color:#00ff66}
.user-code-meta{font-size:10px;color:#666;flex:1;min-width:110px}
.user-code-line button{padding:5px 8px;border:none;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer}
.user-code-copy{background:rgba(0,255,102,0.15);color:#00ff66}
.send-box{flex-basis:100%;display:none;flex-direction:column;gap:8px;margin-top:8px;padding-top:10px;border-top:1px solid #222}
.send-box.show{display:flex}
.send-box textarea{width:100%;min-height:70px;padding:10px;border-radius:8px;border:1px solid #444;background:#1a1a2e;color:#fff;font-size:13px;resize:vertical;outline:none}
.send-box textarea:focus{border-color:#7c3aed}
.send-actions{display:flex;gap:8px;flex-wrap:wrap}
.send-actions button{padding:8px 12px;border:none;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.btn-send{background:rgba(0,255,102,0.15);color:#00ff66}
.btn-send-only{background:rgba(0,204,255,0.15);color:#00ccff}
.btn-cancel{background:rgba(255,68,68,0.2);color:#ff6b6b}
.send-noemail{font-size:11px;color:#ffcc00}
#action-status{display:none;background:#13131f;border:1px solid #333;border-radius:8px;padding:10px 12px;font-size:12px;color:#00ff66;margin-bottom:16px}
#action-status.show{display:block}
#action-status.err{color:#ff6b6b;border-color:rgba(255,68,68,0.4)}
#empty{color:#666;text-align:center;padding:40px;font-size:14px}
#denied{display:none;justify-content:center;align-items:center;min-height:100vh;text-align:center}
#denied .box{background:#13131f;border:1px solid #333;border-radius:16px;padding:28px 24px;width:85%;max-width:340px}
#denied h3{color:#ff6b6b;font-size:18px;margin-bottom:10px}
#denied p{color:#aaa;font-size:13px;margin-bottom:16px}
#denied button{width:100%;padding:12px;border:none;border-radius:10px;background:rgba(255,68,68,0.2);color:#ff6b6b;font-size:14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div id="login-view">
  <div id="login-box">
    <h3>Panel Admin - Magic Kids TV</h3>
    <input type="email" id="admin-email-input" placeholder="Tu email" autocomplete="off">
    <input type="password" id="admin-pass-input" placeholder="Contrasena" autocomplete="off">
    <button id="admin-login-btn">INGRESAR</button>
    <div id="login-status"></div>
  </div>
</div>

<div id="denied">
  <div class="box">
    <h3>Acceso denegado</h3>
    <p>Tu cuenta no tiene permisos de administrador.</p>
    <button id="denied-logout-btn">CERRAR SESION</button>
  </div>
</div>

<div id="panel-view">
  <div id="topbar">
    <div>
      <h1>Panel Admin</h1>
      <span id="admin-email"></span>
    </div>
    <div class="actions">
      <button id="refresh-btn">ACTUALIZAR</button>
      <button class="logout" id="panel-logout-btn">SALIR</button>
    </div>
  </div>
  <div id="codes-section">
    <div id="codes-header">
      <h2>Códigos de activación</h2>
      <button id="gen-code-btn">GENERAR CÓDIGO</button>
    </div>
    <div id="new-code-box">
      <span id="new-code-value"></span>
      <button id="copy-code-btn">COPIAR</button>
    </div>
    <div id="new-code-info"></div>
    <div id="codes-list"></div>
  </div>
  <div id="action-status"></div>
  <div id="user-list"></div>
  <div id="empty">No hay usuarios registrados todavia.</div>
</div>

<script>
var ADMIN_EMAILS=["hgastonsanchez@gmail.com"];
var firebaseConfig={apiKey:"AIzaSyDM7YiLoP5Q-jTB1BBbMluvWL1LIPqCtxI",authDomain:"contadores-magic.firebaseapp.com",databaseURL:"https://contadores-magic-default-rtdb.firebaseio.com",projectId:"contadores-magic",storageBucket:"contadores-magic.firebasestorage.app",messagingSenderId:"58723817117",appId:"1:58723817117:web:f479abaeacf191364ae674"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var usersListening=false;

var loginView=document.getElementById("login-view");
var panelView=document.getElementById("panel-view");
var deniedView=document.getElementById("denied");
var loginStatus=document.getElementById("login-status");

function setLoginStatus(m,ok){
  loginStatus.textContent=m;
  loginStatus.className=m?(ok?"ok":"err"):"";
}
function showView(view){
  loginView.style.display=(view==="login")?"flex":"none";
  panelView.style.display=(view==="panel")?"block":"none";
  deniedView.style.display=(view==="denied")?"flex":"none";
}

document.getElementById("admin-login-btn").onclick=function(){
  var e=document.getElementById("admin-email-input").value.trim();
  var p=document.getElementById("admin-pass-input").value;
  if(!e||!p){setLoginStatus("Completa email y contrasena");return;}
  setLoginStatus("");
  firebase.auth().signInWithEmailAndPassword(e,p).catch(function(err){
    setLoginStatus(authErrorMessage(err));
  });
};
document.getElementById("admin-pass-input").onkeydown=function(e){
  if(e.key==="Enter")document.getElementById("admin-login-btn").onclick();
};

function logout(){
  firebase.auth().signOut();
}
document.getElementById("denied-logout-btn").onclick=logout;
document.getElementById("panel-logout-btn").onclick=logout;
document.getElementById("refresh-btn").onclick=function(){
  if(!usersListening)loadUsers();
};

function authErrorMessage(e){
  var m=e&&e.message?e.message:"";
  if(m.indexOf("invalid-email")!==-1)return "Email invalido";
  if(m.indexOf("user-not-found")!==-1)return "No existe cuenta con ese email";
  if(m.indexOf("wrong-password")!==-1)return "Contrasena incorrecta";
  if(m.indexOf("network-request-failed")!==-1)return "Sin conexion. Revisa internet";
  return m;
}

var cachedUsers=[];
function loadUsers(){
  usersListening=true;
  db.ref("users").on("value",function(snap){
    cachedUsers=[];
    snap.forEach(function(child){
      var u=child.val()||{};
      cachedUsers.push({
        uid:child.key,
        email:u.email||"",
        name:u.name||"",
        blocked:u.blocked===true,
        isAdmin:u.isAdmin===true,
        activeDevice:u.activeDevice||"",
        lastLogin:u.lastLogin||0,
        createdAt:u.createdAt||0
      });
    });
    renderUserList();
  });
}
function renderUserList(){
  var listEl=document.getElementById("user-list");
  var emptyEl=document.getElementById("empty");
  cachedUsers.sort(function(a,b){return (b.lastLogin||0)-(a.lastLogin||0);});
  listEl.innerHTML="";
  if(cachedUsers.length===0){
    emptyEl.style.display="block";
  }else{
    emptyEl.style.display="none";
    cachedUsers.forEach(function(u){listEl.appendChild(userCard(u));});
  }
}

function userCard(u){
  var card=document.createElement("div");
  card.className="user-card";
  var initial=(u.name||u.email||"?").charAt(0).toUpperCase();
  var lastDate=u.lastLogin?new Date(u.lastLogin).toLocaleString():"-";
  var createdDate=u.createdAt?new Date(u.createdAt).toLocaleDateString():"-";
  var device=(u.activeDevice||"").substring(0,12);

  var info=document.createElement("div");
  info.className="user-info";
  info.innerHTML='<span class="name">'+(u.name||"Sin nombre")+'</span>'
    +(u.isAdmin?'<span class="badge admin">ADMIN</span>':'')
    +(u.blocked?'<span class="badge blocked">BLOQUEADO</span>':'<span class="badge active">ACTIVO</span>')
    +'<div class="email">'+(u.email||"-")+'</div>'
    +'<div class="meta">Dispositivo: '+(device||"-")+' | Registro: '+createdDate+' | Ultimo acceso: '+lastDate+'</div>';

  var av=document.createElement("div");
  av.className="user-av";
  av.textContent=initial;

  var actions=document.createElement("div");
  actions.className="user-actions";
  if(!u.isAdmin){
    var blockBtn=document.createElement("button");
    blockBtn.className=u.blocked?"btn-unblock":"btn-block";
    blockBtn.textContent=u.blocked?"DESBLOQUEAR":"BLOQUEAR";
    blockBtn.onclick=function(){
      db.ref("users/"+u.uid+"/blocked").set(!u.blocked);
    };
    actions.appendChild(blockBtn);
  }
  var codeBtn=document.createElement("button");
  codeBtn.className="btn-code";
  codeBtn.textContent="GENERAR CLAVE";
  codeBtn.title="Genera una clave de ingreso para este usuario y la envia por mail";
  codeBtn.onclick=function(){
    toggleSendBox(sendBox);
  };
  actions.appendChild(codeBtn);
  if(u.uid!==firebase.auth().currentUser.uid){
    var delBtn=document.createElement("button");
    delBtn.className="btn-del";
    delBtn.textContent="ELIMINAR";
    delBtn.title="Borra el registro del usuario y le quita el acceso";
    delBtn.onclick=function(){
      if(confirm("¿Eliminar a "+(u.name||u.email)+"? Perdera el acceso y su registro sera borrado.")){
        db.ref("users/"+u.uid).remove();
      }
    };
    actions.appendChild(delBtn);
  }
  if(u.uid!==firebase.auth().currentUser.uid){
    var adminBtn=document.createElement("button");
    adminBtn.className=u.isAdmin?"btn-admin-off":"btn-admin-on";
    adminBtn.textContent=u.isAdmin?"QUITAR ADMIN":"HACER ADMIN";
    adminBtn.onclick=function(){
      db.ref("users/"+u.uid+"/isAdmin").set(!u.isAdmin);
    };
    actions.appendChild(adminBtn);
  }

  var keysBox=document.createElement("div");
  keysBox.className="user-code-box";
  var userCodes=allCodes.filter(function(c){return c.createdFor===u.uid;});
  if(userCodes.length===0){
    keysBox.innerHTML='<div class="user-code-empty">Sin claves asignadas.</div>';
  }else{
    userCodes.forEach(function(c){keysBox.appendChild(userCodeRow(c,u));});
  }

  var sendBox=document.createElement("div");
  sendBox.className="send-box";
  var hasEmail=!!u.email;
  sendBox.innerHTML='<textarea placeholder="Mensaje personalizado (opcional)"></textarea>'
    +'<div class="send-actions">'
    +(hasEmail?'<button class="btn-send">GENERAR Y ENVIAR</button>':'')
    +'<button class="btn-send-only">SOLO GENERAR</button>'
    +'<button class="btn-cancel">CANCELAR</button>'
    +'</div>'
    +(hasEmail?'':'<div class="send-noemail">Este usuario no tiene email registrado. Solo se puede generar la clave.</div>');
  var ta=sendBox.querySelector("textarea");
  ta.value="Hola!\n\nTu clave de acceso a Magic Kids TV es: {CODE}";
  var sendBtn=sendBox.querySelector(".btn-send");
  if(sendBtn)sendBtn.onclick=function(){
    genUserCode(u,ta.value,true);
  };
  var onlyBtn=sendBox.querySelector(".btn-send-only");
  if(onlyBtn)onlyBtn.onclick=function(){
    genUserCode(u,ta.value,false);
  };
  var cancelBtn=sendBox.querySelector(".btn-cancel");
  cancelBtn.onclick=function(){
    closeSendBox(sendBox);
  };

  card.appendChild(av);
  card.appendChild(info);
  card.appendChild(actions);
  card.appendChild(keysBox);
  card.appendChild(sendBox);
  return card;
}

var CODE_CHARS="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
var codesListening=false;
function genCode(){
  var a=new Uint32Array(8);
  crypto.getRandomValues(a);
  var s="";
  for(var i=0;i<8;i++){
    s+=CODE_CHARS[a[i]%CODE_CHARS.length];
    if(i===3)s+="-";
  }
  return s;
}
function fmtDate(t){return t?new Date(t).toLocaleString():"-";}
var lastGenUid="",lastGenCode="";
function genUserCode(u,message,send){
  var code=genCode();
  lastGenUid=u.uid;
  lastGenCode=code;
  var msg=(message||"").replace("{CODE}",code);
  db.ref("codes/"+code).set({
    createdAt:firebase.database.ServerValue.TIMESTAMP,
    createdBy:firebase.auth().currentUser.uid,
    createdFor:u.uid,
    forEmail:u.email||"",
    used:false,
    revoked:false
  }).then(function(){
    if(send&&u.email){
      setSendStatus("Enviando clave a "+u.email+"...");
      sendCodeEmail(u.email,code,msg).then(function(){
        setSendStatus("Clave generada y enviada a "+u.email);
      }).catch(function(e){
        setSendStatus("Clave generada, pero no se pudo enviar el mail: "+((e&&e.message)||"error"),false);
      });
    }else{
      setSendStatus(u.email?"Clave generada (no enviada)":"Clave generada");
    }
  }).catch(function(e){
    setSendStatus("Error al generar la clave: "+((e&&e.message)||"no se pudo crear"),false);
  });
  setTimeout(function(){
    lastGenUid="";
    lastGenCode="";
    renderUserList();
  },6000);
}
function setSendStatus(msg,ok){
  var el=document.getElementById("action-status");
  if(!el)return;
  if(!msg){
    el.className="";
    el.style.display="none";
    return;
  }
  el.textContent=msg;
  el.className="show"+(ok?"":" err");
  el.style.display="block";
}
function toggleSendBox(box){
  if(box.classList.contains("show")){
    box.classList.remove("show");
  }else{
    box.classList.add("show");
  }
}
function closeSendBox(box){
  box.classList.remove("show");
}
function sendCodeEmail(to,code,message){
  return firebase.auth().currentUser.getIdToken().then(function(idToken){
    return fetch("https://magic-kids-tv.vercel.app/api/send-code",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({to:to,code:code,message:message,idToken:idToken})
    }).then(function(r){
      return r.json().then(function(d){
        if(!d.ok)throw new Error(d.error||"No se pudo enviar");
        return d;
      }).catch(function(){throw new Error("Respuesta invalida del servidor");});
    });
  });
}
function userCodeRow(c,u){
  var row=document.createElement("div");
  row.className="user-code-line"+(c.code===lastGenCode&&c.createdFor===lastGenUid?" just-generated":"");
  var status=c.revoked?'<span class="badge blocked">REVOCADO</span>':(c.used?'<span class="badge blocked">USADO</span>':'<span class="badge active">SIN USAR</span>');
  var meta=c.used?("Usado: "+fmtDate(c.usedAt)+(c.usedBy?" ("+c.usedBy.substring(0,12)+")":"")):"Creado: "+fmtDate(c.createdAt);
  row.innerHTML='<span class="user-code-value">'+c.code+'</span>'+status+'<span class="user-code-meta">'+meta+'</span>';
  var copy=document.createElement("button");
  copy.className="user-code-copy";
  copy.textContent="COPIAR";
  copy.onclick=function(){
    if(navigator.clipboard){
      navigator.clipboard.writeText(c.code).then(function(){
        copy.textContent="COPIADO!";
        setTimeout(function(){copy.textContent="COPIAR";},1500);
      });
    }
  };
  var del=document.createElement("button");
  del.className="code-del";
  del.textContent="ELIMINAR CLAVE";
  del.title="Borra la clave, quita la activacion del dispositivo y bloquea el ingreso del usuario";
  del.onclick=function(){
    deleteUserCode(c,u);
  };
  row.appendChild(copy);
  row.appendChild(del);
  return row;
}
function deleteUserCode(c,u){
  if(!confirm("¿Eliminar la clave "+c.code+" de "+(u.name||u.email||u.uid)+"?\nSe quita la activacion del dispositivo y el usuario no podra ingresar de nuevo."))return;
  var device=u.activeDevice||c.usedBy||"";
  var ops=[];
  if(device){
    ops.push(db.ref("activations/"+device).remove());
    ops.push(db.ref("users/"+u.uid+"/activeDevice").set(""));
  }
  ops.push(db.ref("codes/"+c.code).remove());
  ops.push(db.ref("users/"+u.uid+"/blocked").set(true));
  Promise.all(ops).catch(function(e){
    alert("Error: "+((e&&e.message)||"no se pudo eliminar"));
  });
}
function codeCard(c){
  var card=document.createElement("div");
  card.className="code-card";
  var status=c.revoked?'<span class="badge blocked">REVOCADO</span>':(c.used?'<span class="badge blocked">USADO</span>':'<span class="badge active">SIN USAR</span>');
  var meta=(c.forEmail?"Para: "+c.forEmail+" | ":"")+(c.used?("Dispositivo: "+(c.usedBy||"-")+" | Usado: "+fmtDate(c.usedAt)):"Creado: "+fmtDate(c.createdAt));
  card.innerHTML='<span class="code">'+c.code+'</span>'
    +status
    +'<span class="meta">'+meta+'</span>';
  var actions=document.createElement("div");
  actions.className="user-actions";
  if(!c.revoked){
    var rev=document.createElement("button");
    rev.className="code-revoke";
    rev.textContent=c.used?"REVOCAR USO":"REVOCAR";
    rev.onclick=function(){
      db.ref("codes/"+c.code).update({revoked:true});
    };
    actions.appendChild(rev);
  }
  var del=document.createElement("button");
  del.className="code-del";
  del.textContent="BORRAR";
  del.onclick=function(){
    if(confirm("¿Borrar el codigo "+c.code+"?"))db.ref("codes/"+c.code).remove();
  };
  actions.appendChild(del);
  card.appendChild(actions);
  return card;
}
var allCodes=[];
function loadCodes(){
  codesListening=true;
  db.ref("codes").on("value",function(snap){
    allCodes=[];
    snap.forEach(function(child){
      var v=child.val()||{};
      allCodes.push({code:child.key,createdAt:v.createdAt||0,createdBy:v.createdBy||"",createdFor:v.createdFor||"",forEmail:v.forEmail||"",used:v.used===true,usedBy:v.usedBy||"",usedAt:v.usedAt||0,revoked:v.revoked===true});
    });
    allCodes.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
    renderGlobalCodes();
    renderUserList();
  });
}
function renderGlobalCodes(){
  var listEl=document.getElementById("codes-list");
  listEl.innerHTML="";
  var general=allCodes.filter(function(c){return !c.createdFor;});
  if(general.length===0){
    listEl.innerHTML='<div style="color:#666;font-size:12px">No hay codigos generales. Las claves por usuario se administran en cada tarjeta.</div>';
  }
  general.forEach(function(c){listEl.appendChild(codeCard(c));});
}

document.getElementById("gen-code-btn").onclick=function(){
  var code=genCode();
  var box=document.getElementById("new-code-box");
  document.getElementById("new-code-value").textContent=code;
  box.style.display="flex";
  var infoEl=document.getElementById("new-code-info");
  if(infoEl){
    infoEl.style.display="block";
    infoEl.textContent="Codigo general (sin usuario asignado)";
  }
  db.ref("codes/"+code).set({
    createdAt:firebase.database.ServerValue.TIMESTAMP,
    createdBy:firebase.auth().currentUser.uid,
    used:false,
    revoked:false
  }).catch(function(e){
    document.getElementById("new-code-value").textContent="Error: "+((e&&e.message)||"no se pudo crear");
  });
};
document.getElementById("copy-code-btn").onclick=function(){
  var v=document.getElementById("new-code-value").textContent;
  if(navigator.clipboard&&v){
    navigator.clipboard.writeText(v).then(function(){
      document.getElementById("copy-code-btn").textContent="COPIADO!";
      setTimeout(function(){document.getElementById("copy-code-btn").textContent="COPIAR";},1500);
    });
  }
};

firebase.auth().onAuthStateChanged(function(user){
  if(!user){
    usersListening=false;
    codesListening=false;
    showView("login");
    document.getElementById("admin-email").textContent="";
    document.getElementById("user-list").innerHTML="";
    document.getElementById("codes-list").innerHTML="";
    document.getElementById("new-code-box").style.display="none";
    document.getElementById("empty").style.display="none";
    setSendStatus("");
    return;
  }
  document.getElementById("admin-email").textContent=user.email;
  var uid=user.uid;
  db.ref("users/"+uid).once("value",function(snap){
    var data=snap.val()||{};
    if(data.isAdmin===true){
      showView("panel");
      loadUsers();
      loadCodes();
      return;
    }
    var email=user.email||"";
    if(ADMIN_EMAILS.indexOf(email.toLowerCase())!==-1&&!snap.exists()){
      db.ref("users/"+uid).set({
        email:email.toLowerCase(),
        name:"Admin",
        createdAt:firebase.database.ServerValue.TIMESTAMP,
        lastLogin:firebase.database.ServerValue.TIMESTAMP,
        activeDevice:"admin_panel",
        blocked:false,
        isAdmin:true
      }).then(function(){
        showView("panel");
        loadUsers();
        loadCodes();
      }).catch(function(){
        showView("denied");
      });
      return;
    }
    showView("denied");
  });
});
</script>
